[package]
name = "flappy_core"
version = "0.1.0"
edition.workspace = true

[dependencies]
bevy.workspace = true
rand.workspace = true

# `rand::rng()` needs getrandom, which refuses to build for wasm32-unknown-unknown
# unless the JS backend is opted into here and via `--cfg getrandom_backend="wasm_js"`
# (set in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
# Used to size the page element around the canvas; see `web::letterbox_frame`.
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
