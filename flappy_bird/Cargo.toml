[package]
name = "flappy_bird"
version = "0.1.0"
edition.workspace = true

[dependencies]
bevy.workspace = true
flappy_core.workspace = true
rand.workspace = true

# `rand::rng()` needs getrandom, which refuses to build for wasm32-unknown-unknown
# unless the JS backend is opted into here and via `--cfg getrandom_backend="wasm_js"`
# (set in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
