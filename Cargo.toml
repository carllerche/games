[workspace]
resolver = "3"
members = ["flappy_core", "flappy_bird", "undercroft", "cat_powncer"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bevy = "0.19.1"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
flappy_core = { path = "flappy_core" }

# Bevy compiles slowly without these; optimize dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser builds: shrink the .wasm as much as possible.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
