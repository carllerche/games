[workspace]
resolver = "3"
members = ["flappy_core", "flappy_bird", "flappy_bird_3d", "undercroft"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bevy = "0.19.1"
rand = "0.9"
flappy_core = { path = "flappy_core" }

# Bevy compiles slowly without these; optimize dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
