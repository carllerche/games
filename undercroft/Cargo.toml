[package]
name = "undercroft"
version = "0.1.0"
edition.workspace = true
description = "A top-down retro dungeon escape built with Bevy."

[dependencies]
# `wav` lets the synthesized sound effects and music be fed to the audio
# engine as in-memory WAV bytes; no audio files ship with the game.
bevy = { workspace = true, features = ["wav"] }
rand.workspace = true

# `rand::rng()` needs getrandom, which refuses to build for wasm32-unknown-unknown
# unless the JS backend is opted into here and via `--cfg getrandom_backend="wasm_js"`
# (set in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
